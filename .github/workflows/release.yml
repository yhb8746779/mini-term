name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name (e.g. v0.2.9)'
        required: true
        default: 'v0.2.9'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: macos-latest
            target: universal-apple-darwin
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libayatana-appindicator3-dev \
            build-essential \
            file

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Generate changelog
        id: changelog
        shell: bash
        run: |
          CURRENT_TAG="${{ github.ref_name }}"
          PREV_TAG=$(git tag --sort=-v:refname | grep '^v' | sed -n '2p')
          if [ -z "$PREV_TAG" ]; then
            RANGE="$CURRENT_TAG"
          else
            RANGE="${PREV_TAG}..${CURRENT_TAG}"
          fi
          LOGS=$(git log "$RANGE" --pretty=format:"- %s" --no-merges)
          # write to GITHUB_OUTPUT using delimiter
          {
            echo "body<<CHANGELOG_EOF"
            echo "## 更新内容"
            echo ""
            echo "$LOGS"
            echo ""
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Install frontend dependencies
        run: npm ci

      # macOS 签名：证书固定后每次出包的签名身份一致，系统授权（完全磁盘访问等）
      # 不会因重新打包而失效。自签名证书也可以，只是不能公证。
      # 公证相关变量只在 secret 非空时导出：Tauri 读到空字符串也会尝试公证然后失败。
      - name: Enable Apple signing
        if: matrix.platform == 'macos-latest' && vars.ENABLE_APPLE_SIGNING == 'true'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ secrets.APPLE_API_KEY_PATH }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ] || [ -z "$APPLE_SIGNING_IDENTITY" ]; then
            echo "::error::ENABLE_APPLE_SIGNING=true 但缺少 APPLE_CERTIFICATE / APPLE_SIGNING_IDENTITY"
            exit 1
          fi
          # 自签名证书默认不受信任，Tauri 解析签名身份时只认"有效"身份，会报
          # failed to resolve signing identity。把证书加入 runner 的系统信任（仅代码签名），
          # 再在临时钥匙串里确认身份有效，避免白跑 20 分钟编译。
          work="$RUNNER_TEMP/apple-signing"
          mkdir -p "$work"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$work/cert.p12"
          /usr/bin/openssl pkcs12 -in "$work/cert.p12" -nokeys -clcerts \
            -passin env:APPLE_CERTIFICATE_PASSWORD -out "$work/cert.pem"
          if ! grep -q "Apple" <(/usr/bin/openssl x509 -in "$work/cert.pem" -noout -issuer); then
            sudo security add-trusted-cert -d -r trustRoot -p codeSign \
              -k /Library/Keychains/System.keychain "$work/cert.pem"
          fi
          # Tauri 只按 Apple 证书类型前缀（Apple Development: / Developer ID Application: 等）
          # 查找钥匙串里的证书，并要求 subject 带 OU（Team ID），否则同样报 failed to resolve signing identity。
          subject="$(/usr/bin/openssl x509 -in "$work/cert.pem" -noout -subject)"
          if ! grep -qE 'CN ?= ?(iOS Distribution|Apple Distribution|Developer ID Application|Mac App Distribution|Apple Development|iOS App Development|Mac Development): ' <<<"$subject" \
            || ! grep -qE 'OU ?= ?' <<<"$subject"; then
            echo "::error::证书 subject 不符合 Tauri 要求（需 Apple 类型前缀 + OU）：$subject"
            exit 1
          fi
          check_kc="$work/check.keychain-db"
          security create-keychain -p check "$check_kc"
          security import "$work/cert.p12" -k "$check_kc" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign >/dev/null
          if ! security find-identity -v -p codesigning "$check_kc" | grep -qF "\"$APPLE_SIGNING_IDENTITY\""; then
            security find-identity -p codesigning "$check_kc"
            echo "::error::签名身份 $APPLE_SIGNING_IDENTITY 无效（证书未被信任或名称不匹配）"
            exit 1
          fi
          security delete-keychain "$check_kc"
          rm -rf "$work"
          echo "Signing identity OK: $APPLE_SIGNING_IDENTITY"

          export_var() {
            local name="$1"
            local value="${!name}"
            [ -n "$value" ] || return 0
            {
              echo "$name<<__ENV_EOF__"
              echo "$value"
              echo "__ENV_EOF__"
            } >> "$GITHUB_ENV"
          }
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY KEYCHAIN_PASSWORD; do
            export_var "$name"
          done
          if [ -n "$APPLE_API_KEY" ] && [ -n "$APPLE_API_ISSUER" ] && [ -n "$APPLE_API_KEY_PATH" ]; then
            for name in APPLE_API_ISSUER APPLE_API_KEY APPLE_API_KEY_PATH; do export_var "$name"; done
            echo "Notarization: App Store Connect API key"
          elif [ -n "$APPLE_ID" ] && [ -n "$APPLE_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            for name in APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do export_var "$name"; done
            echo "Notarization: Apple ID"
          else
            echo "Notarization: skipped (signing only)"
          fi

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          releaseName: Mini-Term ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          releaseBody: ${{ steps.changelog.outputs.body }}
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}
